# Interview question bank.
#
# Every question carries a rubric: `key_points` are what a strong answer covers.
# The live interviewer uses them to decide on ONE follow-up; the post-session judge
# uses them to score coverage. Keep key points concrete and independently checkable.
#
# Fields: id, role[], level[], topic, type (technical|behavioral), question,
#         key_points[], follow_ups[], difficulty (1-5)
# Roles:  ai-engineer, backend      Levels: junior, mid, senior

# ───────────────────────────── Python ─────────────────────────────
- id: py-001
  role: [ai-engineer, backend]
  level: [junior, mid]
  topic: python
  type: technical
  question: "What is the difference between a list and a tuple in Python, and when would you pick each?"
  key_points:
    - "Lists are mutable, tuples are immutable"
    - "Tuples are hashable (if their items are) so they can be dict keys or set members"
    - "Tuples signal fixed-structure records; lists signal homogeneous collections that change"
    - "Tuples are slightly smaller and faster to create"
  follow_ups:
    - "Can a tuple ever change, for example if it contains a list?"
  difficulty: 1

- id: py-002
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "Explain the Global Interpreter Lock and how it affects concurrency in Python."
  key_points:
    - "The GIL lets only one thread execute Python bytecode at a time in CPython"
    - "CPU-bound work does not speed up with threads; use multiprocessing or native extensions"
    - "I/O-bound work still benefits from threads or asyncio because the GIL is released while waiting"
    - "C extensions like NumPy release the GIL during heavy computation"
    - "Free-threaded CPython builds (PEP 703) are making the GIL optional"
  follow_ups:
    - "How would you parallelise a CPU-heavy preprocessing step over a million documents?"
  difficulty: 3

- id: py-003
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "How does asyncio work, and when is it the right tool compared to threads?"
  key_points:
    - "Single-threaded event loop running coroutines cooperatively"
    - "Coroutines yield control at await points, typically I/O"
    - "Great for many concurrent I/O-bound tasks such as network calls"
    - "Blocking calls stall the whole loop; offload them with to_thread or an executor"
    - "Threads suit blocking libraries without async support"
  follow_ups:
    - "What happens if you call a slow synchronous function inside an async endpoint?"
  difficulty: 3

- id: py-004
  role: [ai-engineer, backend]
  level: [junior, mid]
  topic: python
  type: technical
  question: "What are Python generators and why would you use them?"
  key_points:
    - "Functions using yield that produce values lazily"
    - "Constant memory for large or infinite sequences"
    - "Maintain state between iterations automatically"
    - "Useful for streaming pipelines, like reading a large file line by line"
  follow_ups:
    - "How would you use a generator to batch a stream of records?"
  difficulty: 2

- id: py-005
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "What is a decorator in Python? Give a practical example."
  key_points:
    - "A callable that takes a function and returns a new function wrapping it"
    - "Adds behaviour without changing the original function, like logging, retries, caching or auth"
    - "Use functools.wraps to keep the name and docstring"
    - "Decorators with arguments need an extra level of nesting"
  follow_ups:
    - "How would you write a retry decorator with exponential backoff?"
  difficulty: 2

- id: py-006
  role: [ai-engineer, backend]
  level: [junior, mid]
  topic: python
  type: technical
  question: "Why is using a mutable default argument in a Python function a common bug?"
  key_points:
    - "Default values are evaluated once at function definition time"
    - "The same object is shared across calls, so mutations leak between calls"
    - "Fix by defaulting to None and creating the object inside the function"
  follow_ups:
    - "Where else does evaluation at definition time surprise people?"
  difficulty: 1

- id: py-007
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "How does memory management and garbage collection work in CPython?"
  key_points:
    - "Reference counting frees most objects immediately when the count hits zero"
    - "A cyclic garbage collector handles reference cycles"
    - "Generational collection: young objects are checked more often"
    - "Memory leaks usually come from lingering references, like global caches or closures"
  follow_ups:
    - "How would you track down a memory leak in a long-running service?"
  difficulty: 3

- id: py-008
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "How do you use type hints in a Python codebase, and what do they actually buy you?"
  key_points:
    - "Hints are not enforced at runtime by default"
    - "Static checkers like mypy or pyright catch bugs before running"
    - "Better editor autocompletion and self-documenting interfaces"
    - "Runtime validation libraries like Pydantic use them to parse and validate data"
  follow_ups:
    - "How would you type a function that accepts any object with a read method?"
  difficulty: 2

- id: py-009
  role: [ai-engineer, backend]
  level: [junior, mid]
  topic: python
  type: technical
  question: "What is a context manager and how would you write one?"
  key_points:
    - "Used with the with statement to guarantee setup and cleanup"
    - "Implements __enter__ and __exit__, or uses contextlib.contextmanager with yield"
    - "Cleanup runs even when an exception is raised"
    - "Examples: files, locks, database transactions, timers"
  follow_ups:
    - "How would you write an async context manager?"
  difficulty: 2

- id: py-010
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "How do you structure and manage dependencies in a production Python project?"
  key_points:
    - "Isolated virtual environments per project"
    - "Declare dependencies in pyproject.toml"
    - "Pin exact versions with a lockfile for reproducible builds"
    - "Separate dev, test and optional dependencies"
    - "Automated updates and vulnerability scanning"
  follow_ups:
    - "How do you handle two libraries that need conflicting versions of a dependency?"
  difficulty: 2

- id: py-011
  role: [ai-engineer, backend]
  level: [mid, senior]
  topic: python
  type: technical
  question: "How would you profile and speed up a slow Python function?"
  key_points:
    - "Measure first with a profiler such as cProfile or py-spy instead of guessing"
    - "Find hot spots and improve the algorithm or data structure first"
    - "Vectorise with NumPy or move hot loops to native code"
    - "Cache repeated work, for example with functools.lru_cache"
    - "Use concurrency or multiprocessing where the work allows"
  follow_ups:
    - "What would you do if the profiler shows most time is spent waiting on the network?"
  difficulty: 3

- id: py-012
  role: [ai-engineer, backend]
  level: [junior, mid]
  topic: python
  type: technical
  question: "How do you write good tests in Python, for example with pytest?"
  key_points:
    - "Small, independent tests that each check one behaviour"
    - "Fixtures for setup and shared resources"
    - "Mock external dependencies such as networks or APIs"
    - "Parametrise tests to cover edge cases"
    - "Run tests in CI on every change"
  follow_ups:
    - "How would you test code that calls an LLM API?"
  difficulty: 2

# ───────────────────────────── ML basics ─────────────────────────────
- id: ml-001
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "Explain the bias-variance trade-off."
  key_points:
    - "Bias is error from overly simple assumptions, which leads to underfitting"
    - "Variance is sensitivity to the training data, which leads to overfitting"
    - "Total error combines bias, variance and irreducible noise"
    - "Model complexity, regularisation and more data move the balance"
  follow_ups:
    - "How would you tell from learning curves whether a model has high bias or high variance?"
  difficulty: 2

- id: ml-002
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "What is overfitting and how do you prevent it?"
  key_points:
    - "The model memorises training data and fails to generalise"
    - "Detected by a gap between training and validation performance"
    - "Regularisation such as L1, L2, dropout or weight decay"
    - "More data or data augmentation"
    - "Early stopping and simpler models"
  follow_ups:
    - "Which of these would you try first for a small tabular dataset?"
  difficulty: 1

- id: ml-003
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "How do precision and recall differ, and when would you prioritise one over the other?"
  key_points:
    - "Precision is the share of predicted positives that are correct"
    - "Recall is the share of actual positives that are found"
    - "There is a trade-off controlled by the decision threshold"
    - "Prioritise recall when misses are costly, like fraud or disease screening; precision when false alarms are costly"
    - "F1 combines both; PR curves help with imbalanced data"
  follow_ups:
    - "How would you choose the threshold for a spam filter?"
  difficulty: 2

- id: ml-004
  role: [ai-engineer]
  level: [mid, senior]
  topic: ml-basics
  type: technical
  question: "How do you handle a heavily imbalanced classification dataset?"
  key_points:
    - "Accuracy is misleading; use precision, recall, F1 or PR-AUC"
    - "Resampling: oversample the minority class, for example with SMOTE, or undersample the majority"
    - "Class weights in the loss function"
    - "Tune the decision threshold for the business cost"
    - "Collect more minority-class data if possible"
  follow_ups:
    - "What can go wrong if you oversample before splitting train and test?"
  difficulty: 3

- id: ml-005
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "Why do we split data into training, validation and test sets?"
  key_points:
    - "Training set fits the model parameters"
    - "Validation set tunes hyperparameters and selects models"
    - "Test set gives an unbiased final estimate and is used once"
    - "Cross-validation when data is small"
    - "Splits must avoid leakage, such as time-based splits for temporal data"
  follow_ups:
    - "How would you split data for a model that forecasts next month's sales?"
  difficulty: 1

- id: ml-006
  role: [ai-engineer]
  level: [mid, senior]
  topic: ml-basics
  type: technical
  question: "What is data leakage? Give an example and explain how to avoid it."
  key_points:
    - "Information unavailable at prediction time leaks into training"
    - "Examples: target-derived features, preprocessing fitted on the full dataset, future data in time series"
    - "Leads to great offline metrics and poor production performance"
    - "Fit preprocessing inside the training fold, for example with pipelines, and split by time or group"
  follow_ups:
    - "How might leakage happen when the same user appears in both training and test sets?"
  difficulty: 3

- id: ml-007
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "Explain how gradient descent trains a neural network."
  key_points:
    - "A loss function measures prediction error"
    - "Backpropagation computes gradients of the loss with respect to the weights"
    - "Weights move in the negative gradient direction scaled by the learning rate"
    - "Mini-batch stochastic updates trade noise for speed"
    - "Optimisers like Adam adapt the step size per parameter"
  follow_ups:
    - "What happens if the learning rate is too high or too low?"
  difficulty: 2

- id: ml-008
  role: [ai-engineer]
  level: [mid, senior]
  topic: ml-basics
  type: technical
  question: "When would you use a gradient-boosted tree model instead of a neural network?"
  key_points:
    - "Tabular data with heterogeneous features: boosted trees often win"
    - "Less data needed and faster training"
    - "Handle missing values and feature scales natively"
    - "Easier to interpret with feature importance or SHAP"
    - "Neural networks win on unstructured data like text, images and audio"
  follow_ups:
    - "How would you explain a single prediction of a boosted tree model to a stakeholder?"
  difficulty: 3

- id: ml-009
  role: [ai-engineer]
  level: [junior, mid]
  topic: ml-basics
  type: technical
  question: "What is regularisation and how do L1 and L2 differ?"
  key_points:
    - "Adds a penalty on weight size to the loss to reduce overfitting"
    - "L1 penalises absolute values and pushes weights to exactly zero, which gives sparsity and feature selection"
    - "L2 penalises squared values and shrinks weights smoothly"
    - "The strength is a hyperparameter tuned on validation data"
  follow_ups:
    - "Why does L1 produce exactly-zero weights while L2 doesn't?"
  difficulty: 2

- id: ml-010
  role: [ai-engineer]
  level: [mid, senior]
  topic: ml-basics
  type: technical
  question: "What are embeddings, and how are they used in modern ML systems?"
  key_points:
    - "Dense vectors representing items where similar items are close together"
    - "Learned by models, for example contrastive training for sentence embeddings"
    - "Used for semantic search, clustering, recommendations and classification features"
    - "Similarity is measured with cosine or dot product"
    - "Dimensionality and domain fit affect quality and cost"
  follow_ups:
    - "How would you check whether an off-the-shelf embedding model fits your domain?"
  difficulty: 2

# ───────────────────────────── LLMs & transformers ─────────────────────────────
- id: llm-001
  role: [ai-engineer]
  level: [junior, mid, senior]
  topic: llm
  type: technical
  question: "Explain how self-attention works in a transformer."
  key_points:
    - "Each token is projected into query, key and value vectors"
    - "Attention weights are the softmax of query-key dot products, scaled by the square root of the dimension"
    - "The output is a weighted sum of value vectors"
    - "Multiple heads learn different relationships in parallel"
    - "Cost grows quadratically with sequence length"
  follow_ups:
    - "Why do we divide by the square root of the key dimension?"
  difficulty: 3

- id: llm-002
  role: [ai-engineer]
  level: [junior, mid]
  topic: llm
  type: technical
  question: "What is tokenisation, and why does it matter when working with LLMs?"
  key_points:
    - "Text is split into subword tokens, for example with BPE"
    - "Context limits and pricing are counted in tokens, not words"
    - "Rare words, code and non-English text use more tokens"
    - "Tokenisation explains odd behaviour like poor character counting or arithmetic"
  follow_ups:
    - "How would you estimate the monthly cost of an LLM feature?"
  difficulty: 1

- id: llm-003
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "Compare prompt engineering, RAG and fine-tuning. When would you use each?"
  key_points:
    - "Prompting first: cheapest and fastest to iterate"
    - "RAG when the model needs fresh, private or citable knowledge"
    - "Fine-tuning to change behaviour, format, style or latency, not mainly to add facts"
    - "They can be combined, like a fine-tuned model plus RAG"
    - "Decide based on evaluation results, cost and maintenance"
  follow_ups:
    - "A client wants the model to know their 500-page product manual. Which approach and why?"
  difficulty: 3

- id: llm-004
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "What causes LLM hallucinations and how do you reduce them in a product?"
  key_points:
    - "Models predict plausible text, not verified facts"
    - "Ground answers in retrieved sources and ask for citations"
    - "Instruct the model to say it doesn't know when the context lacks the answer"
    - "Constrain outputs with structured formats and validation"
    - "Measure with faithfulness evals and human review"
  follow_ups:
    - "How would you detect hallucinations automatically in production?"
  difficulty: 3

- id: llm-005
  role: [ai-engineer]
  level: [junior, mid]
  topic: llm
  type: technical
  question: "What do temperature and top-p control when sampling from an LLM?"
  key_points:
    - "Temperature scales the logits: low is focused and deterministic, high is diverse"
    - "Top-p samples from the smallest token set whose probability sums to p"
    - "Low values for extraction or classification; higher values for creative tasks"
    - "Even temperature zero is not always fully deterministic"
  follow_ups:
    - "Which settings would you use for an LLM judge, and why?"
  difficulty: 1

- id: llm-006
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "How does LoRA work, and why is it popular for fine-tuning?"
  key_points:
    - "Freezes the base weights and learns low-rank update matrices"
    - "Trains a tiny fraction of the parameters, so less memory and compute"
    - "Adapters are small files and can be swapped per task"
    - "QLoRA adds a 4-bit quantised base model for even lower memory"
    - "Rank and target modules are key hyperparameters"
  follow_ups:
    - "How would you decide the LoRA rank for a task?"
  difficulty: 4

- id: llm-007
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "What is the KV cache and why does it matter for LLM inference latency?"
  key_points:
    - "Stores attention keys and values of previous tokens"
    - "Avoids recomputing the whole prefix for every new token"
    - "Memory grows with sequence length and batch size"
    - "Techniques like paged attention and prefix caching manage it efficiently"
  follow_ups:
    - "How does prompt or prefix caching reduce cost for a chatbot with a long system prompt?"
  difficulty: 4

- id: llm-008
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "How would you reduce latency and cost of an LLM-powered feature?"
  key_points:
    - "Stream tokens so the user sees output immediately"
    - "Use smaller or distilled models where quality allows, and route by difficulty"
    - "Shorten prompts and cap output length"
    - "Cache responses and use provider prompt caching"
    - "Batch requests and run independent calls in parallel"
  follow_ups:
    - "How would you decide which requests can go to the smaller model?"
  difficulty: 3

- id: llm-009
  role: [ai-engineer]
  level: [junior, mid]
  topic: llm
  type: technical
  question: "What is a context window, and what do you do when your input doesn't fit?"
  key_points:
    - "The maximum number of tokens the model can attend to, input plus output"
    - "Chunk and retrieve only relevant parts with RAG"
    - "Summarise or compress earlier content, for example map-reduce summarisation"
    - "Long contexts cost more and models can miss information in the middle"
  follow_ups:
    - "How would you handle a chatbot conversation that grows past the context limit?"
  difficulty: 2

- id: llm-010
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "How do you get reliable structured output, like JSON, from an LLM?"
  key_points:
    - "Use native structured output, JSON mode or function calling"
    - "Provide a schema and examples in the prompt"
    - "Validate with a schema library such as Pydantic"
    - "Retry or repair on validation failure"
    - "Constrained decoding guarantees valid syntax"
  follow_ups:
    - "What would you do if the JSON is valid but the values are wrong?"
  difficulty: 2

- id: llm-011
  role: [ai-engineer]
  level: [senior]
  topic: llm
  type: technical
  question: "What is quantisation of LLMs, and what are the trade-offs?"
  key_points:
    - "Stores weights at lower precision, like 8-bit or 4-bit, instead of 16-bit"
    - "Cuts memory and often speeds up inference"
    - "Some quality loss, larger at very low bit widths"
    - "Methods such as GPTQ, AWQ and GGUF formats"
    - "Measure quality on your own evals before deploying"
  follow_ups:
    - "How would you decide between a quantised large model and an unquantised small model?"
  difficulty: 4

- id: llm-012
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "What is prompt injection, and how do you defend an LLM application against it?"
  key_points:
    - "Untrusted input contains instructions that override the system prompt"
    - "Indirect injection through retrieved documents, web pages or emails"
    - "No complete fix: use defence in depth"
    - "Least-privilege tools and human confirmation for risky actions"
    - "Separate and mark untrusted content, filter outputs, and monitor"
  follow_ups:
    - "How would you protect an email assistant that can send messages?"
  difficulty: 4

- id: llm-013
  role: [ai-engineer]
  level: [mid, senior]
  topic: llm
  type: technical
  question: "How do instruction tuning and RLHF change a base language model?"
  key_points:
    - "A base model only predicts the next token on web text"
    - "Supervised fine-tuning on instruction-response pairs teaches it to follow instructions"
    - "RLHF or DPO optimises for human preferences using comparisons"
    - "Makes the model more helpful and safer, but can add verbosity or sycophancy"
  follow_ups:
    - "How does DPO differ from classic RLHF with a reward model?"
  difficulty: 4

- id: llm-014
  role: [ai-engineer]
  level: [junior, mid]
  topic: llm
  type: technical
  question: "How would you choose which LLM to use for a new product feature?"
  key_points:
    - "Define the task and build a small evaluation set first"
    - "Compare quality on that eval, not on public leaderboards alone"
    - "Consider latency, cost per request and context length"
    - "Privacy, data residency and hosting: API versus self-hosted"
    - "Plan for switching models: abstract the provider"
  follow_ups:
    - "What would make you choose an open-weight model over an API model?"
  difficulty: 2

# ───────────────────────────── RAG ─────────────────────────────
- id: rag-001
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "How would you evaluate the retrieval quality of a RAG system?"
  key_points:
    - "Recall@k / Precision@k on labeled query-doc pairs"
    - "MRR or nDCG for ranking quality"
    - "Building a golden dataset (synthetic + human-verified)"
    - "Separating retrieval eval from generation eval (faithfulness)"
  follow_ups:
    - "How would you build the labeled dataset if you had none?"
  difficulty: 3

- id: rag-002
  role: [ai-engineer]
  level: [junior, mid]
  topic: rag
  type: technical
  question: "Walk me through the components of a basic retrieval-augmented generation pipeline."
  key_points:
    - "Ingest and chunk documents"
    - "Embed chunks and store them in a vector index"
    - "Embed the query and retrieve the top-k similar chunks"
    - "Put retrieved chunks into the prompt and generate an answer"
    - "Cite sources and handle the case when nothing relevant is found"
  follow_ups:
    - "Where in this pipeline do most quality problems come from in your experience?"
  difficulty: 2

- id: rag-003
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "How do you choose a chunking strategy for RAG?"
  key_points:
    - "Chunk size trades off context completeness against retrieval precision"
    - "Overlap prevents splitting an idea across chunks"
    - "Structure-aware chunking by headings, paragraphs or code blocks"
    - "Add metadata like title and section to chunks"
    - "Tune chunking empirically with retrieval evals"
  follow_ups:
    - "How would you chunk a long PDF full of tables?"
  difficulty: 3

- id: rag-004
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "What is hybrid search, and why combine keyword and vector retrieval?"
  key_points:
    - "Keyword search like BM25 matches exact terms, IDs and rare words"
    - "Vector search matches meaning and paraphrases"
    - "Combine results with reciprocal rank fusion or weighted scores"
    - "Improves recall across different query types"
  follow_ups:
    - "Give an example query where pure vector search fails."
  difficulty: 3

- id: rag-005
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "What does a reranker do in a RAG pipeline, and when is it worth the cost?"
  key_points:
    - "A cross-encoder scores each query-document pair jointly"
    - "More accurate than bi-encoder similarity but slower"
    - "Retrieve many candidates cheaply, then rerank to a small top-k"
    - "Worth it when precision at the top matters and latency allows"
  follow_ups:
    - "How many candidates would you rerank, and how would you decide?"
  difficulty: 3

- id: rag-006
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "Your RAG chatbot gives wrong answers. How do you debug it?"
  key_points:
    - "Check whether the right chunks were retrieved at all, which isolates retrieval from generation"
    - "Inspect chunking, embeddings and query phrasing for retrieval failures"
    - "If context is right, check the prompt and whether the model ignores or misreads it"
    - "Build a failing-case set and track metrics per stage"
    - "Use tracing to see the exact prompt and context"
  follow_ups:
    - "What if the right chunk is retrieved but ranked tenth?"
  difficulty: 3

- id: rag-007
  role: [ai-engineer]
  level: [senior]
  topic: rag
  type: technical
  question: "How would you design a RAG system over millions of documents with access control?"
  key_points:
    - "Scalable ingestion pipeline with incremental updates"
    - "Vector database with metadata filtering"
    - "Enforce permissions at query time with filters on user ACLs"
    - "Never rely on the LLM to hide unauthorised content"
    - "Monitor freshness, latency and retrieval quality"
  follow_ups:
    - "How do you handle a document whose permissions change?"
  difficulty: 5

- id: rag-008
  role: [ai-engineer]
  level: [mid, senior]
  topic: rag
  type: technical
  question: "How do you measure whether a RAG answer is faithful to its sources?"
  key_points:
    - "Faithfulness means every claim is supported by the retrieved context"
