[project]
name = "interview-voice-coach-server"
version = "0.1.0"
description = "Real-time voice interviewer: Pipecat pipeline, interview flow, FastAPI backend and post-session analysis"
readme = "../README.md"
license = "MIT"
# Pipecat's native deps (onnxruntime, ctranslate2, kokoro-onnx) ship wheels up to 3.12/3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "pipecat-ai[webrtc,silero,whisper,openai,deepgram,kokoro,piper]>=1.12,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastembed>=0.5",
    "openai>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Zero-setup local Postgres (+pgvector) for people without Docker.
embedded-db = ["pgserver>=0.1.4"]
# Langfuse (or any OTLP backend) tracing for every pipeline turn.
tracing = ["pipecat-ai[tracing]>=1.12,<2", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# Offline evaluation scripts in ../eval
eval = ["scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.9", "tabulate>=0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
